<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DRAGORA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#08080d;--card:#16161f;--border:#22222f;--fg:#f0f0f8;--sub:#6b6b8a;--muted:#3a3a52;--red:#ff2d2d;--orange:#ff6600;--green:#00e676;--amber:#ffa000;--fd:'Barlow Condensed','Arial Narrow',sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,sans-serif;font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;overflow:hidden}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding:0 16px env(safe-area-inset-bottom,16px);overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .25s}
.screen.active{opacity:1;pointer-events:auto}
#homeScreen{padding-top:env(safe-area-inset-top,16px)}
.logo{font-family:var(--fd);font-size:52px;font-weight:900;letter-spacing:-1px;line-height:1;background:linear-gradient(120deg,var(--red),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;padding:20px 0 2px}
.logo-sub{font-family:var(--fd);font-size:13px;letter-spacing:4px;text-transform:uppercase;color:var(--sub);margin-bottom:16px}
.sec{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--sub);margin:16px 0 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 12px;cursor:pointer;transition:border-color .15s,transform .1s;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,45,45,.08),transparent);opacity:0;transition:opacity .2s}
.card.sel{border-color:var(--red)}.card.sel::before{opacity:1}
.card:active{transform:scale(.97)}.card.wide{grid-column:1/-1}
.ci{font-size:22px;margin-bottom:5px}.cl{font-family:var(--fd);font-size:20px;font-weight:700}.cs{font-size:11px;color:var(--sub);margin-top:2px}
.custom-r{display:none;gap:8px;margin-top:8px}.custom-r.show{display:flex}
.inp{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--fg);padding:12px;font-size:15px;font-family:inherit;outline:none;transition:border-color .15s;width:100%}
.inp:focus{border-color:var(--red)}
.cond{display:flex;gap:8px;margin-top:8px}
.cond-f{flex:1}.cond-l{font-size:10px;color:var(--sub);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
.gps-bar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-top:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.ok{background:var(--green);animation:blink 2s ease-in-out infinite}
.dot.warn{background:var(--amber)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.gps-txt{font-size:12px;color:var(--sub)}
.btn-main{width:100%;margin-top:14px;margin-bottom:16px;padding:18px;border:none;border-radius:14px;background:linear-gradient(120deg,var(--red),var(--orange));color:#fff;font-family:var(--fd);font-size:22px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:opacity .15s,transform .1s;flex-shrink:0}
.btn-main:active{transform:scale(.98);opacity:.9}
.btn-main:disabled{background:var(--card);color:var(--muted);border:1px solid var(--border);cursor:not-allowed;transform:none}
#cdScreen{justify-content:center;align-items:center;gap:24px;background:var(--bg)}
.cd-ring{position:relative;width:220px;height:220px;flex-shrink:0}
.cd-ring svg{width:220px;height:220px;transform:rotate(-90deg)}
.cd-ring circle{fill:none;stroke-width:5}
.cd-track{stroke:var(--border)}.cd-arc{stroke:var(--red);stroke-linecap:round;stroke-dasharray:628.3;transition:stroke-dashoffset .85s linear}
.cd-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cd-n{font-family:var(--fd);font-size:100px;font-weight:900;line-height:1}
.cd-h{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--sub)}
#measScreen{justify-content:space-between;align-items:center;padding-top:env(safe-area-inset-top,20px);padding-bottom:env(safe-area-inset-bottom,20px)}
.spd{font-family:var(--fd);font-size:96px;font-weight:900;line-height:1;letter-spacing:-2px;background:linear-gradient(120deg,var(--red),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.spd-u{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--sub);text-align:center}
.pr{position:relative;width:200px;height:200px}
.pr svg{width:200px;height:200px;transform:rotate(-90deg)}
.pr circle{fill:none;stroke-width:7}
.pr-t{stroke:var(--border)}.pr-f{stroke:url(#pg);stroke-linecap:round;stroke-dasharray:565.5;stroke-dashoffset:565.5;transition:stroke-dashoffset .25s ease-out}
.pr-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pr-time{font-family:var(--fd);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.pr-lbl{font-size:11px;color:var(--sub);letter-spacing:1px;margin-top:2px;text-align:center}
.splits{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.sp{background:var(--card);border:1px solid #2e2e42;border-radius:20px;padding:5px 12px;font-size:12px;display:flex;gap:6px}
.sp-s{color:var(--sub)}.sp-t{font-weight:600;color:var(--orange)}
.btn-stop{width:100%;padding:16px;border-radius:13px;border:1.5px solid var(--red);background:transparent;color:var(--red);font-family:var(--fd);font-size:20px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:background .15s}
.btn-stop:active{background:rgba(255,45,45,.12)}
#resScreen{padding-top:env(safe-area-inset-top,20px);gap:12px}
.res-type{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--sub);margin-top:8px}
.res-hero{text-align:center;padding-bottom:20px;border-bottom:1px solid var(--border)}
.res-big{font-family:var(--fd);font-size:88px;font-weight:900;line-height:1;letter-spacing:-2px;background:linear-gradient(120deg,var(--red),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.res-u{font-size:13px;color:var(--sub);letter-spacing:2px;text-transform:uppercase}
.res-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.rr{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px}
.rr:last-child{border-bottom:none}.rrl{color:var(--sub)}.rrv{font-weight:600;font-variant-numeric:tabular-nums}
.rrv.g{color:var(--green)}.rrv.o{color:var(--orange)}
.br{display:flex;gap:8px}
.btn-g{flex:1;padding:14px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--fg);font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-g:active{background:var(--border)}
.btn-s{flex:2;padding:14px;border-radius:12px;border:none;background:linear-gradient(120deg,var(--red),var(--orange));color:#fff;font-family:var(--fd);font-size:19px;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:opacity .15s,transform .1s}
.btn-s:active{transform:scale(.98);opacity:.9}
</style>
</head>
<body>
<div class="screen active" id="homeScreen">
  <div class="logo">DRAGORA</div>
  <div class="logo-sub">GPS Drag Timer</div>
  <div class="sec">Тип замера</div>
  <div class="grid">
    <div class="card sel" data-m="0-100"><div class="ci">⚡</div><div class="cl">0–100</div><div class="cs">км/ч</div></div>
    <div class="card" data-m="0-200"><div class="ci">🚀</div><div class="cl">0–200</div><div class="cs">км/ч</div></div>
    <div class="card" data-m="100-200"><div class="ci">💨</div><div class="cl">100–200</div><div class="cs">км/ч</div></div>
    <div class="card" data-m="quarter_mile"><div class="ci">🏁</div><div class="cl">¼ мили</div><div class="cs">402 м</div></div>
    <div class="card wide" data-m="custom"><div class="ci">⚙️</div><div class="cl">Кастом</div><div class="cs">своя дистанция</div></div>
  </div>
  <div class="custom-r" id="cr">
    <input class="inp" id="cf" type="number" placeholder="Старт км/ч" min="0" max="300">
    <input class="inp" id="ct" type="number" placeholder="Финиш км/ч" min="1" max="400">
  </div>
  <div class="sec">Условия (опционально)</div>
  <div class="cond">
    <div class="cond-f"><div class="cond-l">🌡 Темп °C</div><input class="inp" id="tmp" type="number" placeholder="20"></div>
    <div class="cond-f"><div class="cond-l">💨 Ветер м/с</div><input class="inp" id="wnd" type="number" placeholder="0"></div>
  </div>
  <div class="gps-bar"><div class="dot" id="gd"></div><div class="gps-txt" id="gt">Получаем GPS…</div></div>
  <button class="btn-main" id="startBtn" disabled>🏁 НАЧАТЬ ЗАМЕР</button>
</div>

<div class="screen" id="cdScreen">
  <div class="cd-ring">
    <svg viewBox="0 0 200 200"><circle class="cd-track" cx="100" cy="100" r="90"/><circle class="cd-arc" id="cda" cx="100" cy="100" r="90"/></svg>
    <div class="cd-c"><div class="cd-n" id="cdn">3</div></div>
  </div>
  <div class="cd-h" id="cdh">ПРИГОТОВЬСЯ</div>
</div>

<div class="screen" id="measScreen">
  <div style="text-align:center;padding-top:10px">
    <div class="spd" id="sv">0</div><div class="spd-u">КМ/Ч</div>
  </div>
  <div class="pr">
    <svg viewBox="0 0 182 182">
      <defs><linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ff2d2d"/><stop offset="100%" stop-color="#ff6600"/></linearGradient></defs>
      <circle class="pr-t" cx="91" cy="91" r="84"/><circle class="pr-f" id="prf" cx="91" cy="91" r="84"/>
    </svg>
    <div class="pr-c"><div class="pr-time" id="pt">0.00</div><div class="pr-lbl" id="pl">0→100 км/ч</div></div>
  </div>
  <div class="splits" id="spr"></div>
  <button class="btn-stop" id="stopBtn">⏹ СТОП</button>
</div>

<div class="screen" id="resScreen">
  <div class="res-type" id="rt">0 → 100 км/ч</div>
  <div class="res-hero"><div class="res-big" id="rb">0.00</div><div class="res-u">СЕКУНД</div></div>
  <div class="res-card" id="rc"></div>
  <div class="br">
    <button class="btn-g" id="retryBtn">🔄 Ещё раз</button>
    <button class="btn-s" id="saveBtn">💾 СОХРАНИТЬ</button>
  </div>
  <button class="btn-g" style="width:100%;margin-top:8px" id="homeBtn">◀️ На главную</button>
</div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#08080d')}catch(e){}}
let mode='0-100',gpsOk=false,wid=null,measuring=false,t0=0,curS=0,maxS=0,totD=0,lp=null,splits={},stgt=[],tF=0,tT=100,done=false,started=false,result=null,etmr=null;
const sb=[];
document.querySelectorAll('.card').forEach(el=>{
  el.addEventListener('click',()=>{
    document.querySelectorAll('.card').forEach(c=>c.classList.remove('sel'));
    el.classList.add('sel');mode=el.dataset.m;
    document.getElementById('cr').classList.toggle('show',mode==='custom');
  });
});
function initGPS(){
  if(!navigator.geolocation){setGPS(false,'GPS не поддерживается');return}
  navigator.geolocation.getCurrentPosition(p=>setGPS(true,`GPS готов · ±${Math.round(p.coords.accuracy)}м`),()=>setGPS(false,'Разреши геолокацию'),{enableHighAccuracy:true,timeout:15000});
}
function setGPS(ok,msg){
  gpsOk=ok;const d=document.getElementById('gd');
  d.className='dot'+(ok?' ok':' warn');
  document.getElementById('gt').textContent=msg;
  document.getElementById('startBtn').disabled=!ok;
}
initGPS();
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function smooth(v){sb.push(v);if(sb.length>4)sb.shift();return sb.reduce((a,b)=>a+b,0)/sb.length}
function hav(a,b){const R=6371000,r=Math.PI/180,dL=(b.lat-a.lat)*r,dl=(b.lon-a.lon)*r,x=Math.sin(dL/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dl/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
function mp(){
  if(mode==='0-100')return{f:0,t:100,sp:[50],l:'0→100 км/ч'};
  if(mode==='0-200')return{f:0,t:200,sp:[100],l:'0→200 км/ч'};
  if(mode==='100-200')return{f:100,t:200,sp:[150],l:'100→200 км/ч'};
  if(mode==='quarter_mile')return{f:0,t:999,d:402.336,sp:[],l:'¼ мили · 402м'};
  const f=parseFloat(document.getElementById('cf').value)||0,t=parseFloat(document.getElementById('ct').value)||100;
  return{f,t,sp:[],l:`${f}→${t} км/ч`};
}
document.getElementById('startBtn').addEventListener('click',()=>{
  const p=mp();tF=p.f;tT=p.t;stgt=[...p.sp];
  document.getElementById('pl').textContent=p.l;
  show('cdScreen');countdown();
});
function countdown(){
  const steps=['3','2','1','GO!'],arc=document.getElementById('cda'),num=document.getElementById('cdn'),hint=document.getElementById('cdh');
  let i=0;arc.style.strokeDashoffset=628.3;arc.style.transition='none';
  requestAnimationFrame(()=>{arc.style.transition='stroke-dashoffset .85s linear';tick()});
  function tick(){
    num.textContent=steps[i];hint.textContent=i<3?'ПРИГОТОВЬСЯ':'ЖМИ!';
    num.style.color=i===3?'#ff2d2d':'#f0f0f8';
    arc.style.strokeDashoffset=628.3*(1-(i+1)/4);
    i++;if(i<steps.length)setTimeout(tick,1000);else setTimeout(startMeas,400);
  }
}
function startMeas(){
  show('measScreen');document.getElementById('spr').innerHTML='';
  measuring=true;done=false;started=(tF===0);
  t0=performance.now();curS=0;maxS=0;totD=0;lp=null;splits={};sb.length=0;
  wid=navigator.geolocation.watchPosition(onPos,()=>{},{enableHighAccuracy:true,maximumAge:0,timeout:5000});
  etmr=setInterval(()=>{if(!measuring)return;document.getElementById('pt').textContent=((performance.now()-t0)/1000).toFixed(2);},50);
}
function onPos(pos){
  if(!measuring)return;
  const{latitude:lat,longitude:lon,speed}=pos.coords;
  curS=smooth(speed!=null?speed*3.6:0);if(curS>maxS)maxS=curS;
  if(lp)totD+=hav(lp,{lat,lon});lp={lat,lon};
  const el=(performance.now()-t0)/1000;
  if(!started&&curS>=tF)started=true;
  if(started)stgt.forEach(sp=>{if(!splits[sp]&&curS>=sp){splits[sp]=el;addSplit(sp,el)}});
  const p=mp(),dd=p.d?totD>=p.d:false,sd=!p.d&&started&&curS>=tT;
  if(!done&&(dd||sd)){done=true;finish(el)}
  document.getElementById('sv').textContent=Math.round(curS);
  const C=565.5,pct=Math.max(0,Math.min((curS-tF)/(tT-tF)||0,1));
  document.getElementById('prf').style.strokeDashoffset=C*(1-pct);
}
function addSplit(sp,t){const r=document.getElementById('spr'),el=document.createElement('div');el.className='sp';el.innerHTML=`<span class="sp-s">${sp}км/ч</span><span class="sp-t">${t.toFixed(2)}с</span>`;r.appendChild(el)}
function stopW(){measuring=false;clearInterval(etmr);if(wid!=null){navigator.geolocation.clearWatch(wid);wid=null}}
function finish(el){stopW();result={type:mode,time:el,top_speed:maxS,distance:totD,temperature:parseFloat(document.getElementById('tmp').value)||0,wind:parseFloat(document.getElementById('wnd').value)||0,splits};showRes()}
document.getElementById('stopBtn').addEventListener('click',()=>{
  const el=(performance.now()-t0)/1000;stopW();
  if(el>0.5){result={type:mode,time:el,top_speed:maxS,distance:totD,temperature:parseFloat(document.getElementById('tmp').value)||0,wind:parseFloat(document.getElementById('wnd').value)||0,splits};showRes()}
  else show('homeScreen');
});
const LB={'0-100':'0 → 100 км/ч','0-200':'0 → 200 км/ч','100-200':'100 → 200 км/ч','quarter_mile':'¼ мили · 402м'};
function showRes(){
  const r=result,p=mp(),l=LB[r.type]||p.l;
  document.getElementById('rt').textContent=l;
  document.getElementById('rb').textContent=r.time.toFixed(2);
  let h=`<div class="rr"><span class="rrl">⏱ Время</span><span class="rrv">${r.time.toFixed(2)} с</span></div>
<div class="rr"><span class="rrl">🏎 Макс скорость</span><span class="rrv o">${r.top_speed.toFixed(1)} км/ч</span></div>
<div class="rr"><span class="rrl">📏 Дистанция</span><span class="rrv">${r.distance.toFixed(0)} м</span></div>`;
  if(r.splits)for(const[sp,t]of Object.entries(r.splits))h+=`<div class="rr"><span class="rrl">Split ${sp}км/ч</span><span class="rrv g">${t.toFixed(2)} с</span></div>`;
  if(r.temperature)h+=`<div class="rr"><span class="rrl">🌡 Температура</span><span class="rrv">${r.temperature}°C</span></div>`;
  if(r.wind)h+=`<div class="rr"><span class="rrl">💨 Ветер</span><span class="rrv">${r.wind} м/с</span></div>`;
  document.getElementById('rc').innerHTML=h;show('resScreen');
}
document.getElementById('saveBtn').addEventListener('click',()=>{
  if(!result)return;
  const d={type:result.type,time:result.time,top_speed:result.top_speed,distance:result.distance,temperature:result.temperature,wind:result.wind};
  if(tg)tg.sendData(JSON.stringify(d));else alert(`${result.time.toFixed(2)} сек сохранено!`);
});
document.getElementById('retryBtn').addEventListener('click',()=>{show('homeScreen');initGPS()});
document.getElementById('homeBtn').addEventListener('click',()=>{show('homeScreen');initGPS()});
</script>
</body>
</html>
