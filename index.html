<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DRAGORA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0a0a0f;
    --card: #13131a;
    --border: #1e1e2e;
    --accent: #ff3d3d;
    --accent2: #ff6b00;
    --text: #ffffff;
    --sub: #7b7b9d;
    --green: #00e676;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* SCREENS */
  .screen { display: none; flex-direction: column; align-items: center; padding: 20px; min-height: 100vh; }
  .screen.active { display: flex; }

  /* HOME */
  .logo { font-size: 42px; font-weight: 900; letter-spacing: -2px; margin-top: 30px;
    background: linear-gradient(135deg, #ff3d3d, #ff6b00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .tagline { color: var(--sub); font-size: 13px; margin-top: 4px; letter-spacing: 2px; text-transform: uppercase; }

  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; margin-top: 30px; }
  .mode-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px 14px; cursor: pointer; transition: all 0.2s; text-align: center;
  }
  .mode-card:active { transform: scale(0.96); border-color: var(--accent); }
  .mode-card.selected { border-color: var(--accent); background: rgba(255,61,61,0.1); }
  .mode-card .icon { font-size: 28px; margin-bottom: 8px; }
  .mode-card .label { font-size: 14px; font-weight: 700; }
  .mode-card .sub { font-size: 11px; color: var(--sub); margin-top: 3px; }

  .custom-row { width: 100%; margin-top: 12px; display: none; }
  .custom-row.show { display: flex; gap: 10px; }
  .custom-input {
    flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    color: var(--text); padding: 14px; font-size: 16px; outline: none;
    transition: border-color 0.2s;
  }
  .custom-input:focus { border-color: var(--accent); }

  .big-btn {
    width: 100%; padding: 18px; border-radius: 16px; border: none; cursor: pointer;
    font-size: 17px; font-weight: 700; letter-spacing: 0.5px; margin-top: 16px;
    background: linear-gradient(135deg, #ff3d3d, #ff6b00);
    color: white; transition: all 0.2s;
  }
  .big-btn:active { transform: scale(0.97); opacity: 0.9; }
  .big-btn:disabled { background: var(--border); color: var(--sub); cursor: not-allowed; transform: none; }

  /* COUNTDOWN */
  #countdownScreen {
    justify-content: center; background: var(--bg);
  }
  .countdown-ring { position: relative; width: 200px; height: 200px; margin-bottom: 30px; }
  .countdown-ring svg { width: 200px; height: 200px; transform: rotate(-90deg); }
  .countdown-ring circle { fill: none; stroke-width: 6; }
  .ring-bg { stroke: var(--border); }
  .ring-fg { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 565; transition: stroke-dashoffset 0.9s linear; }
  .countdown-num {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 80px; font-weight: 900; color: var(--text);
  }
  .countdown-label { font-size: 16px; color: var(--sub); letter-spacing: 3px; text-transform: uppercase; }

  /* MEASURING */
  #measuringScreen { justify-content: space-between; padding-top: 40px; padding-bottom: 40px; }
  .speed-display { text-align: center; }
  .speed-val { font-size: 88px; font-weight: 900; line-height: 1; letter-spacing: -4px;
    background: linear-gradient(135deg, #ff3d3d, #ff6b00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .speed-unit { font-size: 16px; color: var(--sub); letter-spacing: 2px; margin-top: 4px; }

  .progress-ring { position: relative; width: 220px; height: 220px; margin: 20px auto; }
  .progress-ring svg { width: 220px; height: 220px; transform: rotate(-90deg); }
  .progress-ring circle { fill: none; stroke-width: 8; }
  .pr-bg { stroke: var(--border); }
  .pr-fg { stroke-linecap: round; stroke-dasharray: 628;
    stroke: url(#grad); transition: stroke-dashoffset 0.3s; }
  .progress-inner {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center;
  }
  .progress-time { font-size: 36px; font-weight: 800; }
  .progress-target { font-size: 12px; color: var(--sub); margin-top: 4px; }

  .splits-row { display: flex; gap: 12px; width: 100%; justify-content: center; flex-wrap: wrap; }
  .split-badge {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 14px; font-size: 13px; text-align: center;
  }
  .split-badge .sv { font-weight: 700; color: var(--accent); }

  .stop-btn {
    width: 100%; padding: 16px; border-radius: 14px; border: 2px solid var(--accent);
    background: transparent; color: var(--accent); font-size: 16px; font-weight: 700;
    cursor: pointer; transition: all 0.2s;
  }
  .stop-btn:active { background: rgba(255,61,61,0.15); }

  /* RESULT */
  #resultScreen { justify-content: flex-start; padding-top: 30px; }
  .result-header { text-align: center; margin-bottom: 24px; }
  .result-time { font-size: 72px; font-weight: 900; letter-spacing: -3px;
    background: linear-gradient(135deg, #ff3d3d, #ff6b00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .result-unit { font-size: 14px; color: var(--sub); }

  .result-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; padding: 16px; margin-bottom: 12px; }
  .result-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .result-row:last-child { border-bottom: none; }
  .result-row .rl { color: var(--sub); font-size: 14px; }
  .result-row .rv { font-weight: 700; font-size: 14px; }
  .rv.green { color: var(--green); }

  .btn-row { display: flex; gap: 10px; width: 100%; margin-top: 4px; }
  .btn-sec {
    flex: 1; padding: 14px; border-radius: 13px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-sec:active { background: var(--border); }

  /* CONDITIONS */
  .cond-row { display: flex; gap: 10px; width: 100%; margin-bottom: 12px; }
  .cond-field { flex: 1; }
  .cond-label { font-size: 11px; color: var(--sub); margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }

  /* GPS status */
  .gps-bar { display: flex; align-items: center; gap: 8px; background: var(--card);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; width: 100%; margin-top: 12px; }
  .gps-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sub); flex-shrink: 0; }
  .gps-dot.ok { background: var(--green); animation: pulse 1.5s infinite; }
  .gps-dot.warn { background: #ffa000; }
  .gps-txt { font-size: 12px; color: var(--sub); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .section-title { font-size: 11px; color: var(--sub); letter-spacing: 1.5px; text-transform: uppercase;
    align-self: flex-start; margin-bottom: 10px; margin-top: 20px; }
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="homeScreen">
  <div class="logo">DRAGORA</div>
  <div class="tagline">GPS Drag Timer</div>

  <div class="section-title" style="margin-top:28px">Тип замера</div>
  <div class="mode-grid">
    <div class="mode-card selected" data-mode="0-100">
      <div class="icon">⚡</div>
      <div class="label">0 – 100</div>
      <div class="sub">км/ч</div>
    </div>
    <div class="mode-card" data-mode="0-200">
      <div class="icon">🚀</div>
      <div class="label">0 – 200</div>
      <div class="sub">км/ч</div>
    </div>
    <div class="mode-card" data-mode="100-200">
      <div class="icon">💨</div>
      <div class="label">100 – 200</div>
      <div class="sub">км/ч</div>
    </div>
    <div class="mode-card" data-mode="quarter_mile">
      <div class="icon">🏁</div>
      <div class="label">¼ мили</div>
      <div class="sub">402 м</div>
    </div>
    <div class="mode-card" data-mode="custom" style="grid-column:1/-1">
      <div class="icon">⚙️</div>
      <div class="label">Кастомный</div>
      <div class="sub">своя дистанция</div>
    </div>
  </div>

  <div class="custom-row" id="customRow">
    <input class="custom-input" id="customFrom" type="number" placeholder="Старт км/ч" min="0" max="300">
    <input class="custom-input" id="customTo" type="number" placeholder="Финиш км/ч" min="1" max="400">
  </div>

  <div class="section-title">Условия (опционально)</div>
  <div class="cond-row">
    <div class="cond-field">
      <div class="cond-label">🌡 Темп °C</div>
      <input class="custom-input" id="tempInput" type="number" placeholder="20" style="padding:10px">
    </div>
    <div class="cond-field">
      <div class="cond-label">💨 Ветер м/с</div>
      <input class="custom-input" id="windInput" type="number" placeholder="0" style="padding:10px">
    </div>
  </div>

  <div class="gps-bar" id="gpsBar">
    <div class="gps-dot" id="gpsDot"></div>
    <div class="gps-txt" id="gpsTxt">Получаем GPS...</div>
  </div>

  <button class="big-btn" id="startBtn" disabled>🚀 Начать замер</button>
</div>

<!-- COUNTDOWN -->
<div class="screen" id="countdownScreen">
  <div class="countdown-ring">
    <svg viewBox="0 0 200 200">
      <circle class="ring-bg" cx="100" cy="100" r="90"/>
      <circle class="ring-fg" id="cdRing" cx="100" cy="100" r="90"/>
    </svg>
    <div class="countdown-num" id="cdNum">3</div>
  </div>
  <div class="countdown-label" id="cdLabel">Приготовься</div>
</div>

<!-- MEASURING -->
<div class="screen" id="measuringScreen">
  <div class="speed-display">
    <div class="speed-val" id="speedVal">0</div>
    <div class="speed-unit">КМ/Ч</div>
  </div>

  <div class="progress-ring">
    <svg viewBox="0 0 220 220">
      <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#ff3d3d"/>
          <stop offset="100%" style="stop-color:#ff6b00"/>
        </linearGradient>
      </defs>
      <circle class="pr-bg" cx="110" cy="110" r="100"/>
      <circle class="pr-fg" id="progressRing" cx="110" cy="110" r="100"/>
    </svg>
    <div class="progress-inner">
      <div class="progress-time" id="elapsedTime">0.00</div>
      <div class="progress-target" id="targetLabel">0 → 100 км/ч</div>
    </div>
  </div>

  <div class="splits-row" id="splitsRow"></div>

  <button class="stop-btn" id="stopBtn">⏹ Стоп</button>
</div>

<!-- RESULT -->
<div class="screen" id="resultScreen">
  <div class="result-header">
    <div style="font-size:13px;color:var(--sub);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px" id="resultType"></div>
    <div class="result-time" id="resultTime">0.00</div>
    <div class="result-unit">секунд</div>
  </div>

  <div class="result-card" id="resultCard"></div>

  <div class="btn-row">
    <button class="btn-sec" id="retryBtn">🔄 Ещё раз</button>
    <button class="big-btn" id="saveBtn" style="margin-top:0;flex:1">💾 Сохранить</button>
  </div>
  <button class="btn-sec" style="width:100%;margin-top:10px" id="homeBtn">◀️ На главную</button>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// State
let selectedMode = '0-100';
let customFrom = 0, customTo = 100;
let gpsReady = false;
let watchId = null;
let measuring = false;
let startTime = 0;
let currentSpeed = 0;
let maxSpeed = 0;
let totalDist = 0;
let lastPos = null;
let elapsedInterval = null;
let splits = {};
let measureResult = null;
let targetFrom = 0, targetTo = 100;
let measureDone = false;

// Mode cards
document.querySelectorAll('.mode-card').forEach(card => {
  card.addEventListener('click', () => {
    document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
    card.classList.add('selected');
    selectedMode = card.dataset.mode;
    const customRow = document.getElementById('customRow');
    customRow.classList.toggle('show', selectedMode === 'custom');
    updateTargetLabels();
  });
});

function getTargetSpeeds() {
  if (selectedMode === '0-100') return [0, 100];
  if (selectedMode === '0-200') return [0, 200];
  if (selectedMode === '100-200') return [100, 200];
  if (selectedMode === 'quarter_mile') return [0, 999]; // distance-based
  if (selectedMode === 'custom') {
    const f = parseFloat(document.getElementById('customFrom').value) || 0;
    const t = parseFloat(document.getElementById('customTo').value) || 100;
    return [f, t];
  }
  return [0, 100];
}

function getModeLabel() {
  const labels = { '0-100': '0 → 100 км/ч', '0-200': '0 → 200 км/ч',
    '100-200': '100 → 200 км/ч', 'quarter_mile': '¼ мили (402 м)', 'custom': 'Кастом' };
  if (selectedMode === 'custom') {
    const [f,t] = getTargetSpeeds();
    return `${f} → ${t} км/ч`;
  }
  return labels[selectedMode] || selectedMode;
}

function updateTargetLabels() {
  document.getElementById('targetLabel').textContent = getModeLabel();
}

// GPS
function startGPS() {
  if (!navigator.geolocation) {
    setGPS(false, 'GPS недоступен');
    return;
  }
  const opts = { enableHighAccuracy: true, maximumAge: 500, timeout: 10000 };
  navigator.geolocation.getCurrentPosition(pos => {
    setGPS(true, `GPS: ±${Math.round(pos.coords.accuracy)}м`);
  }, err => {
    setGPS(false, 'Разреши доступ к геолокации');
  }, opts);
}

function setGPS(ok, txt) {
  gpsReady = ok;
  const dot = document.getElementById('gpsDot');
  dot.className = 'gps-dot' + (ok ? ' ok' : ' warn');
  document.getElementById('gpsTxt').textContent = txt;
  document.getElementById('startBtn').disabled = !ok;
}

startGPS();

// Show screen
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── COUNTDOWN ──
document.getElementById('startBtn').addEventListener('click', () => {
  [targetFrom, targetTo] = getTargetSpeeds();
  updateTargetLabels();
  showScreen('countdownScreen');
  doCountdown();
});

function doCountdown() {
  const nums = ['3', '2', '1', 'GO!'];
  const ring = document.getElementById('cdRing');
  const num = document.getElementById('cdNum');
  const lbl = document.getElementById('cdLabel');
  const full = 565;
  let step = 0;

  function tick() {
    if (step >= nums.length) { startMeasuring(); return; }
    num.textContent = nums[step];
    lbl.textContent = step < 3 ? 'Приготовься' : '🏁 ГАЗУЙ!';
    ring.style.strokeDashoffset = full - (full * (step + 1) / 4);
    num.style.color = step === 3 ? '#ff3d3d' : 'white';
    step++;
    if (step < nums.length) setTimeout(tick, 1000);
    else setTimeout(() => { startMeasuring(); }, 500);
  }
  tick();
}

// ── MEASURING ──
function haversine(p1, p2) {
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(p2.lat - p1.lat), dLon = toRad(p2.lon - p1.lon);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(p1.lat))*Math.cos(toRad(p2.lat))*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Simple smoothing buffer
const speedBuf = [];
function smoothSpeed(s) {
  speedBuf.push(s);
  if (speedBuf.length > 3) speedBuf.shift();
  return speedBuf.reduce((a,b)=>a+b,0) / speedBuf.length;
}

function startMeasuring() {
  showScreen('measuringScreen');
  document.getElementById('splitsRow').innerHTML = '';
  measuring = true;
  measureDone = false;
  startTime = performance.now();
  maxSpeed = 0; totalDist = 0; lastPos = null;
  splits = {};
  speedBuf.length = 0;

  const splitTargets = selectedMode === '0-200' ? [50, 100] :
                       selectedMode === '100-200' ? [150] : [];

  const opts = { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 };
  watchId = navigator.geolocation.watchPosition(pos => {
    if (!measuring) return;
    const { latitude: lat, longitude: lon, speed, accuracy } = pos.coords;
    const rawKmh = speed != null ? speed * 3.6 : 0;
    currentSpeed = smoothSpeed(rawKmh);
    if (currentSpeed > maxSpeed) maxSpeed = currentSpeed;

    if (lastPos) totalDist += haversine(lastPos, { lat, lon });
    lastPos = { lat, lon };

    const elapsed = (performance.now() - startTime) / 1000;

    // Check splits
    splitTargets.forEach(sp => {
      if (!splits[sp] && currentSpeed >= sp) {
        splits[sp] = elapsed;
        addSplitBadge(sp, elapsed);
      }
    });

    // Check finish condition
    if (!measureDone) {
      const done = selectedMode === 'quarter_mile'
        ? totalDist >= 402.336
        : currentSpeed >= targetTo && (targetFrom === 0 || currentSpeed >= targetFrom);

      // For 100-200 and custom, also check start speed reached
      const started = targetFrom === 0 || currentSpeed >= targetFrom;

      if (done && started) {
        measureDone = true;
        finishMeasuring(elapsed);
      }
    }

    updateMeasuringUI(elapsed);
  }, err => {
    console.warn('GPS error', err);
  }, opts);

  // UI timer
  elapsedInterval = setInterval(() => {
    if (!measuring) return;
    const el = (performance.now() - startTime) / 1000;
    document.getElementById('elapsedTime').textContent = el.toFixed(2);
  }, 50);
}

function addSplitBadge(sp, t) {
  const row = document.getElementById('splitsRow');
  const b = document.createElement('div');
  b.className = 'split-badge';
  b.innerHTML = `<div style="color:var(--sub);font-size:11px">${sp} км/ч</div><div class="sv">${t.toFixed(2)}с</div>`;
  row.appendChild(b);
}

function updateMeasuringUI(elapsed) {
  document.getElementById('speedVal').textContent = Math.round(currentSpeed);

  const ring = document.getElementById('progressRing');
  let pct = 0;
  if (selectedMode === 'quarter_mile') pct = Math.min(totalDist / 402.336, 1);
  else {
    const range = targetTo - targetFrom;
    pct = range > 0 ? Math.min((currentSpeed - targetFrom) / range, 1) : 0;
    if (pct < 0) pct = 0;
  }
  ring.style.strokeDashoffset = 628 * (1 - pct);
}

function finishMeasuring(elapsed) {
  stopMeasuring();
  measureResult = {
    type: selectedMode,
    time: elapsed,
    top_speed: maxSpeed,
    distance: totalDist,
    temperature: parseFloat(document.getElementById('tempInput').value) || 0,
    wind: parseFloat(document.getElementById('windInput').value) || 0,
    splits
  };
  showResult(measureResult);
}

function stopMeasuring() {
  measuring = false;
  if (watchId != null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  clearInterval(elapsedInterval);
}

document.getElementById('stopBtn').addEventListener('click', () => {
  const elapsed = (performance.now() - startTime) / 1000;
  stopMeasuring();
  if (elapsed > 0.5) {
    measureResult = {
      type: selectedMode, time: elapsed, top_speed: maxSpeed,
      distance: totalDist,
      temperature: parseFloat(document.getElementById('tempInput').value) || 0,
      wind: parseFloat(document.getElementById('windInput').value) || 0,
      splits
    };
    showResult(measureResult);
  } else {
    showScreen('homeScreen');
  }
});

// ── RESULT ──
function showResult(r) {
  const labels = { '0-100': '0 → 100 км/ч', '0-200': '0 → 200 км/ч',
    '100-200': '100 → 200 км/ч', 'quarter_mile': '¼ мили (402 м)' };

  document.getElementById('resultType').textContent = labels[r.type] || getModeLabel();
  document.getElementById('resultTime').textContent = r.time.toFixed(2);

  let html = `
    <div class="result-row"><span class="rl">⏱ Время</span><span class="rv">${r.time.toFixed(2)} сек</span></div>
    <div class="result-row"><span class="rl">🏎 Макс скорость</span><span class="rv">${r.top_speed.toFixed(1)} км/ч</span></div>
    <div class="result-row"><span class="rl">📏 Дистанция</span><span class="rv">${r.distance.toFixed(0)} м</span></div>`;

  if (r.splits && Object.keys(r.splits).length) {
    for (const [sp, t] of Object.entries(r.splits)) {
      html += `<div class="result-row"><span class="rl">Split ${sp} км/ч</span><span class="rv green">${t.toFixed(2)} с</span></div>`;
    }
  }
  if (r.temperature) html += `<div class="result-row"><span class="rl">🌡 Температура</span><span class="rv">${r.temperature}°C</span></div>`;
  if (r.wind) html += `<div class="result-row"><span class="rl">💨 Ветер</span><span class="rv">${r.wind} м/с</span></div>`;

  document.getElementById('resultCard').innerHTML = html;
  showScreen('resultScreen');
}

document.getElementById('saveBtn').addEventListener('click', () => {
  if (!measureResult) return;
  const data = {
    type: measureResult.type,
    time: measureResult.time,
    top_speed: measureResult.top_speed,
    distance: measureResult.distance,
    temperature: measureResult.temperature,
    wind: measureResult.wind
  };
  if (tg) {
    tg.sendData(JSON.stringify(data));
  } else {
    alert('Результат: ' + JSON.stringify(data, null, 2));
  }
});

document.getElementById('retryBtn').addEventListener('click', () => {
  showScreen('homeScreen');
  startGPS();
});

document.getElementById('homeBtn').addEventListener('click', () => {
  showScreen('homeScreen');
  startGPS();
});
</script>
</body>
</html>
